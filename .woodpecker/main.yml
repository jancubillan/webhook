steps:
  build:
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      registry: https://registry.rogescus.com
      username:
        from_secret: nexus_username
      password:
        from_secret: nexus_password
      repo: registry.rogescus.com/jancubillan/webhook
      tag: [latest, "${CI_COMMIT_SHA}"]
    when:
      event: [push, manual]
